<!DOCTYPE html>
<html>
<head>

    <title>Interviewer Login - RecruitFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5" style="max-width: 500px;">

    <div class="text-center mb-4">

        <h2>RecruitFlow</h2>

        <p class="text-muted">
            Interviewer Login
        </p>

    </div>


    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-danger">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <div class="card">

        <div class="card-body">

            <h4 class="mb-4">
                Login as Interviewer
            </h4>

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input type="text"
                           name="username"
                           class="form-control"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input type="password"
                           name="password"
                           class="form-control"
                           required>

                </div>


                <button type="submit"
                        class="btn btn-primary w-100">

                    Interviewer Login

                </button>

            </form>

        </div>

    </div>


    <div class="text-center mt-4">

        <a href="{% url 'candidate_login' %}">
            Candidate Login
        </a>

        <span class="mx-2">|</span>

        <a href="{% url 'recruiter_login' %}">
            Recruiter Login
        </a>

    </div>

</div>

<div class="text-center mt-3">

    <p>
        New interviewer?
        <a href="{% url 'register' %}">
            Create an account
        </a>
    </p>

</div>

</body>
</html>
